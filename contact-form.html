<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>Hubungi — Form Kontak</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #020617;
        --card: #0f172a;
        --card-2: #111c33;
        --line: rgba(148, 163, 184, 0.16);
        --blue: #3b82f6;
        --blue-strong: #2563eb;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --danger: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(60% 50% at 50% -10%, rgba(37, 99, 235, 0.16), transparent 70%),
          radial-gradient(40% 40% at 90% 100%, rgba(59, 130, 246, 0.08), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .contact-card {
        position: relative;
        width: 100%;
        max-width: 560px;
        padding: 38px 36px 34px;
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        background:
          radial-gradient(120% 90% at 10% 0%, rgba(59, 130, 246, 0.12), transparent 55%),
          linear-gradient(180deg, var(--card-2) 0%, var(--card) 55%, #0b1424 100%);
        box-shadow:
          0 32px 80px rgba(2, 6, 23, 0.85),
          0 8px 24px rgba(2, 6, 23, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      /* Aksen garis tipis di tepi atas kartu */
      .contact-card::before {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.65), transparent);
      }

      .card-head {
        margin-bottom: 26px;
      }

      .card-title {
        margin: 0 0 8px;
        font-size: 30px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--blue);
      }

      .card-sub {
        margin: 0;
        max-width: 42ch;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }

      .field {
        margin-bottom: 18px;
      }

      .field-label {
        display: block;
        margin-bottom: 8px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #cbd5e1;
      }

      .control {
        position: relative;
      }

      .control-icon {
        position: absolute;
        top: 50%;
        left: 15px;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        color: #64748b;
        pointer-events: none;
        transition: color 0.2s ease;
      }

      .control input,
      .control textarea {
        width: 100%;
        font: inherit;
        font-size: 14.5px;
        color: var(--text);
        background: rgba(2, 6, 23, 0.55);
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .control input {
        height: 50px;
        padding: 0 16px 0 46px;
      }

      .control textarea {
        min-height: 136px;
        padding: 14px 16px 14px 46px;
        resize: vertical;
        line-height: 1.6;
      }

      .control textarea + .control-icon,
      .control .icon-top {
        top: 16px;
        transform: none;
      }

      .control input::placeholder,
      .control textarea::placeholder {
        color: #64748b;
      }

      .control input:focus,
      .control textarea:focus {
        border-color: var(--blue);
        background: rgba(2, 6, 23, 0.8);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
      }

      .control:focus-within .control-icon {
        color: var(--blue);
      }

      .field.invalid .control input,
      .field.invalid .control textarea {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.12);
      }

      .field.invalid .control-icon {
        color: var(--danger);
      }

      .field-error {
        display: none;
        margin: 7px 0 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--danger);
      }

      .field.invalid .field-error {
        display: block;
      }

      .submit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        height: 50px;
        margin-top: 8px;
        font: inherit;
        font-size: 14.5px;
        font-weight: 600;
        color: #ffffff;
        background: var(--blue-strong);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        cursor: pointer;
        box-shadow:
          0 10px 24px rgba(37, 99, 235, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        transition:
          background 0.2s ease,
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }

      .submit-btn:hover:not(:disabled) {
        background: var(--blue);
        box-shadow:
          0 14px 30px rgba(59, 130, 246, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }

      .submit-btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .submit-btn:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 3px rgba(2, 6, 23, 1),
          0 0 0 6px rgba(59, 130, 246, 0.55);
      }

      .submit-btn:disabled {
        cursor: wait;
        opacity: 0.75;
      }

      .submit-btn svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .spinner {
        display: none;
        width: 17px;
        height: 17px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      .submit-btn.is-loading .spinner {
        display: inline-block;
      }

      .submit-btn.is-loading .send-icon {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== Toast ===== */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: calc(100vw - 40px);
        padding: 13px 18px;
        font-size: 13.5px;
        font-weight: 500;
        color: #dcfce7;
        background: rgba(6, 40, 26, 0.96);
        border: 1px solid rgba(74, 222, 128, 0.35);
        border-radius: 12px;
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.75);
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, 14px);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          visibility 0.25s;
      }

      .toast.show {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
      }

      .toast svg {
        width: 18px;
        height: 18px;
        flex: none;
        color: #4ade80;
      }

      @media (max-width: 540px) {
        .contact-card {
          padding: 28px 22px 24px;
          border-radius: 20px;
        }

        .card-title {
          font-size: 26px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="contact-card">
      <header class="card-head">
        <h1 class="card-title">Hubungi</h1>
        <p class="card-sub">Ada yang mau didiskusikan? Langsung kirim pesan aja ya...</p>
      </header>

      <form id="contact-form" novalidate>
        <!-- Nama -->
        <div class="field" data-field="name">
          <label class="field-label" for="name">Nama</label>
          <div class="control">
            <svg
              class="control-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 21a8 8 0 0 0-16 0" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Nama lengkap kamu"
              autocomplete="name"
              required
              aria-describedby="err-name"
            />
          </div>
          <p class="field-error" id="err-name">Nama wajib diisi.</p>
        </div>

        <!-- Email -->
        <div class="field" data-field="email">
          <label class="field-label" for="email">Email</label>
          <div class="control">
            <svg
              class="control-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2.5" />
              <path d="m3.5 7 7.3 5.2a2 2 0 0 0 2.4 0L20.5 7" />
            </svg>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="nama@email.com"
              autocomplete="email"
              required
              aria-describedby="err-email"
            />
          </div>
          <p class="field-error" id="err-email">Masukkan alamat email yang valid.</p>
        </div>

        <!-- Pesan -->
        <div class="field" data-field="message">
          <label class="field-label" for="message">Pesan</label>
          <div class="control">
            <svg
              class="control-icon icon-top"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14 2.5H7a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.5Z" />
              <path d="M14 2.5v5h5" />
              <path d="M9 13h6M9 17h4" />
            </svg>
            <textarea
              id="message"
              name="message"
              placeholder="Tulis pesanmu di sini..."
              required
              maxlength="5000"
              aria-describedby="err-message"
            ></textarea>
          </div>
          <p class="field-error" id="err-message">Pesan wajib diisi.</p>
        </div>

        <button class="submit-btn" type="submit" id="submit-btn">
          <span class="spinner" aria-hidden="true"></span>
          <svg
            class="send-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4Z" />
          </svg>
          <span id="submit-label">Kirim Pesan</span>
        </button>
      </form>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1" />
        <path d="m9 11 3 3L22 4" />
      </svg>
      <span id="toast-text">Pesan berhasil disiapkan, silakan cek aplikasi email Anda.</span>
    </div>

    <script>
      (function () {
        'use strict'

        var TO_EMAIL = 'hamdanif042@gmail.com'
        var form = document.getElementById('contact-form')
        var submitBtn = document.getElementById('submit-btn')
        var submitLabel = document.getElementById('submit-label')
        var toast = document.getElementById('toast')
        var toastText = document.getElementById('toast-text')
        var toastTimer = null

        var fields = {
          name: {
            input: document.getElementById('name'),
            wrap: document.querySelector('[data-field="name"]'),
            validate: function (value) {
              return value.trim().length >= 2 ? '' : 'Nama wajib diisi (minimal 2 karakter).'
            },
          },
          email: {
            input: document.getElementById('email'),
            wrap: document.querySelector('[data-field="email"]'),
            validate: function (value) {
              var pattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/
              if (!value.trim()) return 'Email wajib diisi.'
              return pattern.test(value.trim()) ? '' : 'Masukkan alamat email yang valid.'
            },
          },
          message: {
            input: document.getElementById('message'),
            wrap: document.querySelector('[data-field="message"]'),
            validate: function (value) {
              return value.trim().length >= 5 ? '' : 'Pesan wajib diisi (minimal 5 karakter).'
            },
          },
        }

        function setError(field, message) {
          var errorEl = field.wrap.querySelector('.field-error')
          if (message) {
            field.wrap.classList.add('invalid')
            field.input.setAttribute('aria-invalid', 'true')
            errorEl.textContent = message
          } else {
            field.wrap.classList.remove('invalid')
            field.input.removeAttribute('aria-invalid')
          }
        }

        function validateAll() {
          var firstInvalid = null

          Object.keys(fields).forEach(function (key) {
            var field = fields[key]
            var message = field.validate(field.input.value)
            setError(field, message)
            if (message && !firstInvalid) firstInvalid = field.input
          })

          return firstInvalid
        }

        Object.keys(fields).forEach(function (key) {
          var field = fields[key]
          field.input.addEventListener('input', function () {
            if (field.wrap.classList.contains('invalid')) {
              setError(field, field.validate(field.input.value))
            }
          })
        })

        function showToast(message) {
          toastText.textContent = message
          toast.classList.add('show')
          clearTimeout(toastTimer)
          toastTimer = setTimeout(function () {
            toast.classList.remove('show')
          }, 6000)
        }

        function buildMailto(name, email, message) {
          var subject = 'Pesan dari ' + name
          var body = message + '\r\n\r\nDari: ' + email
          return (
            'mailto:' +
            TO_EMAIL +
            '?subject=' +
            encodeURIComponent(subject) +
            '&body=' +
            encodeURIComponent(body)
          )
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault()

          var firstInvalid = validateAll()
          if (firstInvalid) {
            firstInvalid.focus()
            return
          }

          var name = fields.name.input.value.trim()
          var email = fields.email.input.value.trim()
          var message = fields.message.input.value.trim()

          submitBtn.disabled = true
          submitBtn.classList.add('is-loading')
          submitLabel.textContent = 'Menyiapkan...'

          var mailtoUrl = buildMailto(name, email, message)

          setTimeout(function () {
            window.location.href = mailtoUrl

            submitBtn.disabled = false
            submitBtn.classList.remove('is-loading')
            submitLabel.textContent = 'Kirim Pesan'
            showToast('Pesan berhasil disiapkan, silakan cek aplikasi email Anda.')
          }, 850)
        })
      })()
    </script>
  </body>
</html>
