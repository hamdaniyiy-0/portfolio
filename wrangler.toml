# ============================================================
# Cloudflare Workers — konfigurasi deploy portofolio
# ============================================================
# Worker/Pages project name di Cloudflare.
name = "portfolio"

# Tanggal kompatibilitas runtime Workers.
compatibility_date = "2026-11-01"

# ------------------------------------------------------------
# Static assets: hasil `npm run build` (folder dist).
# Fallback SPA supaya refresh di URL dalam tetap memuat index.html.
# ------------------------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# ------------------------------------------------------------
# Environment variables
#
# Tidak ada blok `[vars]` di sini. VITE_SUPABASE_URL dan
# VITE_SUPABASE_ANON_KEY diisi di Cloudflare Dashboard:
#   Workers & Pages -> portfolio -> Settings -> Build
#   -> Variables and Secrets
# agar terbaca oleh Vite saat `npm run build`, tanpa duplikasi
# dengan konfigurasi runtime di file ini.
# ------------------------------------------------------------
